[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-tools-mcp"
version = "0.5.0"
description = "Workspace-confined coding tools exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
  "PyJWT>=2.8",
]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Coding Tools MCP Contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/xyTom/coding-tools-mcp"
Documentation = "https://coding-tools-mcp.github.io/docs/"
Source = "https://github.com/xyTom/coding-tools-mcp"
Issues = "https://github.com/xyTom/coding-tools-mcp/issues"

[project.optional-dependencies]
dev = [
  # The official MCP SDK is the only client in the test suite we did not
  # write; the dual-era smoke needs it installed to run at all.
  "mcp>=2.0",
  "mypy>=2.1,<2.2",
  "PyYAML>=6.0",
  "ruff>=0.15,<0.16",
  "typing_extensions>=4.12",
]
image = [
  "Pillow>=10.0",
]

[project.scripts]
coding-tools-mcp = "coding_tools_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_tools_mcp*"]
