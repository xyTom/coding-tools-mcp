name: release

# Merge a version PR into main. Tags are receipts written LAST, not triggers.
# Recovery uses this workflow from main and the same version-introducing commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to recover, for example 0.5.1 (run from main)'
        type: string
        required: true

permissions:
  contents: read

env:
  CODING_TOOLS_MCP_TELEMETRY: 'off'

jobs:
  plan:
    name: Select immutable release commit
    if: github.repository == 'xyTom/coding-tools-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      npm_version: ${{ steps.plan.outputs.npm_version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - name: Resolve first publication or recovery
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          VERSION: ${{ inputs.version }}
        run: python -m scripts.release_plan --head "$GITHUB_SHA" --before "$BEFORE" --version "$VERSION" --output release-plan.json
      - uses: actions/checkout@v6.0.2
        if: steps.plan.outputs.publish == 'true'
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Validate release metadata and existing tag
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SOURCE: ${{ steps.plan.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_versions.py --root source --tag "$TAG"
          python -m scripts.finalize_release --tag "$TAG" --source "$SOURCE"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.plan.outputs.publish == 'true'
        with:
          name: release-plan-${{ steps.plan.outputs.source_sha }}
          path: release-plan.json
          retention-days: 90
          overwrite: true

  compliance:
    name: Hard gate
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/compliance.yml
    with:
      source_ref: ${{ needs.plan.outputs.source_sha }}

  native-sandbox:
    name: Native sandbox hard gate
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/cross-platform-sandbox.yml
    with:
      source_ref: ${{ needs.plan.outputs.source_sha }}

  real-workloads:
    name: Hard gate
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/real-workloads.yml
    with:
      source_ref: ${{ needs.plan.outputs.source_sha }}

  # Evidence is deliberately absent from build/publish needs. External Docker,
  # Hugging Face and harness outages must not block or delay package publication.
  swebench-lite:
    name: Advisory evidence
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/swebench-lite.yml
    with:
      source_ref: ${{ needs.plan.outputs.source_sha }}
      blocking: false

  build:
    name: Build and verify packages
    needs: [plan, compliance, native-sandbox, real-workloads]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned build tools
        run: python -m pip install -r source/scripts/release-build-requirements.txt
      - name: Build source and wheel distributions
        working-directory: source
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Verify wheel contents and installation
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/verify_release_packages.py --source source
      - name: Install source-pinned npm pack tooling
        run: npm install --global "npm@$(cat source/scripts/release-npm-version.txt)"
      - name: Test and pack npm launcher
        working-directory: source
        run: |
          make check-npm-launcher
          cd packages/npm-launcher
          npm pack
      - name: Preflight BOTH registries before either publication
        id: registry-preflight
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NPM_VERSION: ${{ needs.plan.outputs.npm_version }}
        run: |
          python -m scripts.release_artifacts pypi --directory source/dist --version "$VERSION"
          python -m scripts.release_artifacts npm --directory source/packages/npm-launcher --version "$NPM_VERSION"
        # Read-only: detect known conflicts before either package can be uploaded.
        # Publishers still revalidate under their locks; this is not a transaction.
      - name: Upload Python distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions-${{ needs.plan.outputs.source_sha }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Upload npm distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-distribution-${{ needs.plan.outputs.source_sha }}
          path: source/packages/npm-launcher/*.tgz
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish-pypi:
    name: Verify or publish PyPI
    needs: [plan, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-pypi-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/coding-tools-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7.0.0
        with:
          name: python-distributions-${{ needs.plan.outputs.source_sha }}
          path: dist
      - name: Verify existing files and stage only missing distributions
        id: registry
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python -m scripts.release_artifacts pypi --directory dist --version "$VERSION" --stage pending
      - name: Publish missing Python distributions
        if: steps.registry.outputs.missing != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pending/
          # Existing contents were compared above. Never conceal an upload error.
          skip-existing: false
      - name: Verify complete PyPI contents
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python -m scripts.release_artifacts pypi --directory dist --version "$VERSION" --require-complete --wait-seconds 120 --report pypi-receipt.json

      - name: Save verified PyPI receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-receipt-${{ needs.plan.outputs.source_sha }}
          path: pypi-receipt.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  publish-npm:
    name: Verify or publish npm
    needs: [plan, build]
    runs-on: ubuntu-latest
    concurrency:
      # Serialize latest-tag selection and publication across launcher versions.
      group: release-npm
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/package/coding-tools-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v7.0.0
        with:
          name: npm-distribution-${{ needs.plan.outputs.source_sha }}
          path: dist
      - name: Validate existing npm package contents
        id: registry
        env:
          VERSION: ${{ needs.plan.outputs.npm_version }}
        run: python -m scripts.release_artifacts npm --directory dist --version "$VERSION" --select-publish-tag
      - name: Install OIDC-capable npm CLI
        if: steps.registry.outputs.missing != '0'
        run: npm install --global npm@11.18.0
      - name: Publish missing launcher with provenance
        if: steps.registry.outputs.missing != '0'
        # ./ prevents npm from interpreting a tarball as GitHub owner/repo.
        env:
          PUBLISH_TAG: ${{ steps.registry.outputs.publish_tag }}
        run: npm publish ./dist/*.tgz --access public --provenance --tag "$PUBLISH_TAG"
      - name: Verify complete npm contents
        env:
          VERSION: ${{ needs.plan.outputs.npm_version }}
        run: python -m scripts.release_artifacts npm --directory dist --version "$VERSION" --require-complete --wait-seconds 120 --report npm-receipt.json

      - name: Save verified npm receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-receipt-${{ needs.plan.outputs.source_sha }}
          path: npm-receipt.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  github-release:
    name: Finalize tag and GitHub Release
    needs: [plan, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    concurrency:
      group: release-finalize-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - name: Create missing tag and release only after BOTH registries verified
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE: ${{ needs.plan.outputs.source_sha }}
        run: python -m scripts.finalize_release --tag "$TAG" --source "$SOURCE" --changelog source/CHANGELOG.md --finalize --github-token
